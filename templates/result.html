<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Analysis Result - EcoValue AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020b12;
    }

    h1,
    h2,
    h3,
    .font-heading {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>

<body
  class="min-h-screen text-slate-200 flex flex-col justify-center items-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020b12] to-black">

  <div class="max-w-2xl w-full">
    <div class="bg-slate-900/60 backdrop-blur-xl p-8 rounded-3xl border border-slate-700 shadow-2xl">

      <div class="flex flex-col md:flex-row gap-8 items-center mb-8 border-b border-slate-700/60 pb-8">
        <img src="{{ image_path }}" alt="Scanned Material"
          class="w-48 h-48 object-cover rounded-2xl border border-slate-600 shadow-lg">

        <div class="text-center md:text-left">
          <span
            class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-bold uppercase tracking-widest mb-3 inline-block">
            Analysis Complete
          </span>
          <h1 class="font-heading text-4xl md:text-5xl font-bold text-white mb-2">{{ material }}</h1>
          <p class="text-emerald-400 font-semibold text-sm uppercase tracking-wide mb-2">Category: {{ category }}</p>
          <p class="text-slate-400 font-medium text-sm">Ready to be transformed or disposed of safely.</p>
        </div>
      </div>

      <h3 class="text-center font-heading text-2xl text-white mb-6">Choose Your Next Step</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <a href="/dispose/{{ category }}"
          class="py-4 px-6 rounded-xl border border-slate-600 bg-black/40 hover:bg-slate-800 transition text-center text-white font-semibold shadow-md flex items-center justify-center gap-2">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
            </path>
          </svg>
          How to Dispose Safely
        </a>

        <a href="/recycle/{{ category }}"
          class="py-4 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 text-center font-bold shadow-[0_0_20px_rgba(52,211,153,0.3)] transition transform hover:-translate-y-1 flex items-center justify-center gap-2">
          <svg class="w-5 h-5 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          Ask AI for Upcycle Ideas
        </a>
      </div>

    </div>

    <div class="text-center mt-8">
      <a href="/"
        class="text-slate-500 hover:text-emerald-400 transition text-sm font-semibold flex items-center justify-center gap-1">
        ← Scan Another Item
      </a>
    </div>
  </div>

</body>

</html>
